name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:types --workspace packages/client

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # oficjalny obraz zamiast gitleaks-action (ta wymaga licencji dla organizacji — bez niej
      # brama byłaby martwa); pełna historia (fetch-depth: 0), sekrety w outpucie redagowane
      - run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46
          detect --source /repo --no-banner --redact --exit-code 1

  fixture-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # najstarszy wspierany konsument: React 18, webpack, bez flag v4
          - name: react18-webpack
            react: "^18.3.1"
            faster: "false"
            v4: "false"
          # dzisiejszy default nowego projektu: React 19, webpack, future.v4
          - name: react19-webpack-v4
            react: ""
            faster: "false"
            v4: "true"
          # bundler rspack (@docusaurus/faster)
          - name: react19-faster
            react: ""
            faster: "true"
            v4: "true"
    name: fixture (${{ matrix.name }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install (npm ci)
        if: matrix.react == ''
        run: npm ci
      - name: Install with React override
        if: matrix.react != ''
        # overrides wymuszają JEDNĄ wersję Reacta w całym drzewie (bez dwóch kopii przy hoistingu);
        # zmiana package.json unieważnia lockfile, stąd install zamiast ci
        run: |
          npm pkg set overrides.react='${{ matrix.react }}' overrides.react-dom='${{ matrix.react }}'
          npm install --no-audit --no-fund
      - name: Build fixture site
        env:
          FIXTURE_FASTER: ${{ matrix.faster }}
          FIXTURE_V4: ${{ matrix.v4 }}
        run: npm run build --workspace fixtures/site
      - name: Smoke check
        run: |
          grep -q "docs-chat:ezd:v2" fixtures/site/build/index.html
          grep -q "docs-chat-navbar-item" fixtures/site/build/index.html
          # panel w SSG HTML = DocsChat naprawdę zamontowany przez wrap Root (nie tylko lifecycle)
          grep -q "docs-chat-panel" fixtures/site/build/index.html
