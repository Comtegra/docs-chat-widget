name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # npm Trusted Publishing (OIDC) — bez tokenów w sekretach; wymaga skonfigurowania
  # Trusted Publisher dla obu paczek na npmjs.com (patrz RELEASING.md)
  id-token: write

concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      # trusted publishing wymaga npm >= 11.5 (node 22 bundluje starszy); przypięte do majora,
      # żeby świeży major npm nie zepsuł wydania w losowy wtorek
      - run: npm install -g npm@^11.5
      - name: Version PR / publish
        uses: changesets/action@v1
        with:
          # własny krok version: sam `changeset version` nie dotyka package-lock.json —
          # bez tego lockfile dryfuje i wjeżdża śmieciem do pierwszego cudzego PR-a po wydaniu.
          # Koniecznie przez `npm run` — akcja NIE przepuszcza tego stringa przez shell
          # (inline `&&` poszedłby jako literalny argument do changeset = cichy no-op)
          version: npm run release:version
          publish: npx changeset publish
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
