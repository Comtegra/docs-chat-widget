name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # npm Trusted Publishing (OIDC) — bez tokenów w sekretach; wymaga skonfigurowania
  # Trusted Publisher dla obu paczek na npmjs.com (patrz RELEASING.md)
  id-token: write

concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      # trusted publishing wymaga npm >= 11.5 (node 22 bundluje starszy)
      - run: npm install -g npm@latest
      - name: Version PR / publish
        uses: changesets/action@v1
        with:
          publish: npx changeset publish
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
